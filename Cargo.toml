[package]
name = "gemini-unmark"
version = "0.2.4"
edition = "2021"
license = "MIT"
authors = ["deinoshub"]
description = "Remove Gemini visible sparkle watermarks via reverse alpha-blend (pure Rust)"
repository = "https://github.com/deinoshub/gemini-unmark"
homepage = "https://github.com/deinoshub/gemini-unmark"
documentation = "https://docs.rs/gemini-unmark"
readme = "README.md"
keywords = ["watermark", "gemini", "image", "video"]
categories = ["multimedia::images", "multimedia::video", "command-line-utilities"]
exclude = [
    ".superpowers",
    ".superpowers/**",
    "third_party/ffmpeg",
    "third_party/ffmpeg/**",
    "third_party/ncnn-src",
    "third_party/ncnn-src/**",
    "third_party/ncnn-prebuilt",
    "third_party/ncnn-prebuilt/**",
]

[features]
default = []
video = ["dep:tempfile", "dep:image", "dep:rayon"]
# Skip build-time ffmpeg/ffprobe download; runtime uses GUM_FFMPEG/GUM_FFPROBE
# then PATH only. Combine with `video` or `video-fdncnn`.
system-ffmpeg = []
# FDnCNN (NcnnDenoiser) ROI postpass after reverse-blend. Requires `video`.
# Downloads the official Tencent/ncnn static zip for TARGET (cmake fallback).
video-fdncnn = ["video"]
# CLI binary: video + FDnCNN + system ffmpeg (no bundled ffmpeg download).
cli = ["video-fdncnn", "system-ffmpeg", "dep:clap"]

[dependencies]
tempfile = { version = "3", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff"] }
rayon = { version = "1.10", optional = true }
clap = { version = "4", features = ["derive"], optional = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[[bin]]
name = "gunmark"
path = "src/main.rs"
required-features = ["cli"]

[build-dependencies]
cc = "1"

[[example]]
name = "bench_time"
required-features = ["video"]

[[example]]
name = "probe_force_alpha"
required-features = ["video"]
