name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (default features)
        run: cargo test

  video:
    name: video (ubuntu, system-ffmpeg, all-features)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GSR_SKIP_FFMPEG_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system ffmpeg and C++ link deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg g++ libgomp1
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Test all video features (no bundled ffmpeg download)
        run: cargo test --all-features
      - name: Release-build library and examples
        run: cargo build --release --examples --all-features
