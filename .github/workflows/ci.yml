name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (default features)
        run: cargo test

  video:
    name: video (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GUM_SKIP_FFMPEG_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: third_party/ncnn-prebuilt
          key: ncnn-prebuilt-20260526-${{ runner.os }}-${{ runner.arch }}
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg g++ libgomp1
          ffmpeg -version | head -n 1
      - name: Install macOS ffmpeg
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install Windows ffmpeg
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Test video + FDnCNN (system ffmpeg, official ncnn zip)
        run: cargo test --features video-fdncnn,system-ffmpeg
      - name: Release-build CLI
        run: cargo build --release --features cli --bin gunmark
      - name: Release-build examples
        if: runner.os == 'Linux'
        run: cargo build --release --examples --features video-fdncnn,system-ffmpeg
