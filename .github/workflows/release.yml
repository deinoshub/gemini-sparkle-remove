name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GUM_SKIP_FFMPEG_DOWNLOAD: "1"

jobs:
  crate:
    name: package crate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: third_party/ncnn-prebuilt
          key: ncnn-prebuilt-20260526-${{ runner.os }}-${{ runner.arch }}
      - name: Install system ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg g++ libgomp1
      - name: Check tag matches Cargo.toml version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          expect="${tag#v}"
          got="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "$got" != "$expect" ]; then
            echo "Cargo.toml version '$got' does not match tag '$tag'" >&2
            exit 1
          fi
          echo "version $got matches $tag"
          echo "VERSION=$got" >> "$GITHUB_ENV"
      - name: Test (default features)
        run: cargo test
      - name: Test video + FDnCNN
        run: cargo test --features video-fdncnn,system-ffmpeg
      - name: Package crate
        run: cargo package
      - name: Checksums
        run: |
          set -euo pipefail
          crate="target/package/gemini-unmark-${VERSION}.crate"
          sha256sum "$crate" | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: crate
          path: |
            target/package/gemini-unmark-*.crate
            SHA256SUMS.txt

  bin:
    name: bin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: gunmark-linux-x86_64
          - os: macos-latest
            artifact: gunmark-macos-aarch64
          - os: windows-latest
            artifact: gunmark-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: third_party/ncnn-prebuilt
          key: ncnn-prebuilt-20260526-${{ runner.os }}-${{ runner.arch }}
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg g++ libgomp1
      - name: Install macOS ffmpeg
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install Windows ffmpeg
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Build CLI
        run: cargo build --release --features cli --bin gunmark
      - name: Stage binary
        shell: bash
        run: |
          if [ -f target/release/gunmark.exe ]; then
            cp target/release/gunmark.exe "${{ matrix.artifact }}"
          else
            cp target/release/gunmark "${{ matrix.artifact }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  github-release:
    name: GitHub Release
    needs: [crate, bin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la dist
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
